name: Main Source Branch Check

on:
  pull_request:
    branches: ["main"]

jobs:
  check-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Only the develop branch can merge into main."
            exit 1
          fi